name: Nightly Kernel Check

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_userland:
    name: Build Userland (2.3.4)
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zfs:
          - 2.3.4
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Checkout zfs-builder
        uses: actions/checkout@v4
        with:
          repository: datadatdat/zfs-builder
          token: ${{ secrets.GO_MODULES_TOKEN }}
          path: zfs-builder
      - name: Build zfs-builder image
        run: |
          cd zfs-builder
          docker buildx build --platform linux/amd64 --load -t datadatdat/zfs-builder:latest .
      - name: Create Kernel Build File
        run: ./scripts/setup_kernel.sh
      - name: Build
        run: ./build -u -z ${{ matrix.zfs }} $(uname -r)
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  get_kernels_ubuntu-24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '^1.21'
      - name: Setup GO environment
        run: |
          go mod download
      - id: set-matrix
        run: echo "matrix=$(go run cmd/kernels/kernels.go -l ubuntu24)" >> $GITHUB_OUTPUT
        env:
          GITHUB_PAT: ${{ secrets.REPO_TOKEN }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  build_kernel_ubuntu-24:
    name: Build Kernel (2.3.4, ${{ matrix.kernels }})
    needs: get_kernels_ubuntu-24
    if: startsWith(github.ref, 'refs/heads/') && needs.get_kernels_ubuntu-24.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zfs:
          - 2.3.4
        kernels: ${{ fromJson(needs.get_kernels_ubuntu-24.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Checkout zfs-builder
        uses: actions/checkout@v4
        with:
          repository: datadatdat/zfs-builder
          token: ${{ secrets.GO_MODULES_TOKEN }}
          path: zfs-builder
      - name: Build zfs-builder image
        run: |
          cd zfs-builder
          docker buildx build --platform linux/amd64 --load -t datadatdat/zfs-builder:latest .
      - name: Build
        run: ./build -k -z ${{ matrix.zfs }} ${{ matrix.kernels }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
