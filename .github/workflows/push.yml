name: Push

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_image:
    name: Build ZFS Builder Image (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Checkout zfs-builder
        uses: actions/checkout@v4
        with:
          repository: datadatdat/zfs-builder
          token: ${{ secrets.GO_MODULES_TOKEN }}
      - name: Build zfs-builder image
        run: docker buildx build --platform ${{ matrix.platform }} --load -t datadatdat/zfs-builder:latest .
      - name: Save Docker image
        run: docker save datadatdat/zfs-builder:latest | gzip > zfs-builder.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: zfs-builder-${{ matrix.arch }}
          path: zfs-builder.tar.gz
          retention-days: 1

  build_userland:
    name: Build Userland (${{ matrix.arch }}, ${{ matrix.zfs }}, ${{ matrix.kernel }})
    needs: build_image
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            kernel: 6.6.71-linuxkit
            zfs: 2.3.4
          - arch: amd64
            kernel: 6.6.71-linuxkit
            zfs: 2.2.8
          - arch: arm64
            kernel: 6.8.0-64-generic
            zfs: 2.3.4
          - arch: arm64
            kernel: 6.8.0-64-generic
            zfs: 2.2.8
          - arch: arm64
            kernel: 6.8.0-88-generic
            zfs: 2.3.4
          - arch: arm64
            kernel: 6.8.0-88-generic
            zfs: 2.2.8
          - arch: arm64
            kernel: 6.8.0-90-generic
            zfs: 2.3.4
          - arch: arm64
            kernel: 6.8.0-90-generic
            zfs: 2.2.8
          - arch: arm64
            kernel: 6.8.0-94-generic
            zfs: 2.3.4
          - arch: arm64
            kernel: 6.8.0-94-generic
            zfs: 2.2.8
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v3
      - name: Download zfs-builder image
        uses: actions/download-artifact@v4
        with:
          name: zfs-builder-${{ matrix.arch }}
      - name: Load Docker image
        run: gunzip -c zfs-builder.tar.gz | docker load
      - name: Build
        run: ./build -u -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ matrix.zfs }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}

  build_kernel:
    name: Build Kernel (${{ matrix.arch }}, ${{ matrix.zfs }}, ${{ matrix.kernel }})
    needs: build_image
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD64 builds
          - arch: amd64
            zfs: 2.3.4
            kernel: 6.6.71-linuxkit
          - arch: amd64
            zfs: 2.3.4
            kernel: 6.6.13-linuxkit
          - arch: amd64
            zfs: 2.3.4
            kernel: 5.15.27-linuxkit
          - arch: amd64
            zfs: 2.3.4
            kernel: 5.10.104-linuxkit
          # Disabled: 5.15.0-25-generic has incompatible symbol exports (__x86_return_thunk, fault_in_iov_iter_readable, timer_delete_sync)
          # See: https://github.com/datadatdat/zfs-releases/actions/runs/21638695810
          # - arch: amd64
          #   zfs: 2.3.4
          #   kernel: 5.15.0-25-generic
          - arch: amd64
            zfs: 2.3.4
            kernel: 6.8.0-64-generic
          - arch: amd64
            zfs: 2.2.8
            kernel: 6.6.71-linuxkit
          - arch: amd64
            zfs: 2.2.8
            kernel: 6.6.13-linuxkit
          - arch: amd64
            zfs: 2.2.8
            kernel: 5.15.27-linuxkit
          - arch: amd64
            zfs: 2.2.8
            kernel: 5.10.104-linuxkit
          # Disabled: 5.15.0-25-generic has incompatible symbol exports (__x86_return_thunk, fault_in_iov_iter_readable, timer_delete_sync)
          # See: https://github.com/datadatdat/zfs-releases/actions/runs/21638695810
          # - arch: amd64
          #   zfs: 2.2.8
          #   kernel: 5.15.0-25-generic
          - arch: amd64
            zfs: 2.2.8
            kernel: 6.8.0-64-generic
          # ARM64 builds
          - arch: arm64
            zfs: 2.3.4
            kernel: 6.8.0-64-generic
          - arch: arm64
            zfs: 2.2.8
            kernel: 6.8.0-64-generic
          - arch: arm64
            zfs: 2.3.4
            kernel: 6.8.0-88-generic
          - arch: arm64
            zfs: 2.2.8
            kernel: 6.8.0-88-generic
          - arch: arm64
            zfs: 2.3.4
            kernel: 6.8.0-90-generic
          - arch: arm64
            zfs: 2.2.8
            kernel: 6.8.0-90-generic
          - arch: arm64
            zfs: 2.3.4
            kernel: 6.8.0-94-generic
          - arch: arm64
            zfs: 2.2.8
            kernel: 6.8.0-94-generic
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v3
      - name: Download zfs-builder image
        uses: actions/download-artifact@v4
        with:
          name: zfs-builder-${{ matrix.arch }}
      - name: Load Docker image
        run: gunzip -c zfs-builder.tar.gz | docker load
      - name: Build
        run: ./build -k -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ matrix.zfs }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}
