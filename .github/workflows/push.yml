name: Push

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-zfs-version:
    name: Resolve ZFS Version
    runs-on: ubuntu-latest
    outputs:
      zfs_version: ${{ steps.resolve.outputs.zfs_version }}
    steps:
      - name: Determine ZFS version
        id: resolve
        run: |
          LATEST=$(curl -s https://api.github.com/repos/openzfs/zfs/releases | \
            jq -r '[.[] | select(.prerelease == false)] | first | .tag_name' | sed 's/^zfs-//')
          echo "zfs_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest stable ZFS: $LATEST"

  build_userland:
    name: Build Userland (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernel }})
    needs: [resolve-zfs-version]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        kernel:
          - 6.8.0-64-generic
          - 6.8.0-88-generic
          - 6.8.0-90-generic
          - 6.8.0-94-generic
          - 6.8.0-100-generic
          - 6.8.0-101-generic
          - 6.8.0-106-generic
          - 6.8.0-107-generic
          - 6.8.0-110-generic
          - 6.8.0-111-generic
          - 7.0.0-15-generic
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ matrix.arch }} datadatdat/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: ./build -u -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}

  build_kernel:
    name: Build Kernel (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernel }})
    needs: [resolve-zfs-version]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        kernel:
          - 6.8.0-64-generic
          - 6.8.0-88-generic
          - 6.8.0-90-generic
          - 6.8.0-94-generic
          - 6.8.0-100-generic
          - 6.8.0-101-generic
          - 6.8.0-106-generic
          - 6.8.0-107-generic
          - 6.8.0-110-generic
          - 6.8.0-111-generic
          - 7.0.0-15-generic
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ matrix.arch }} datadatdat/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: ./build -k -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}
