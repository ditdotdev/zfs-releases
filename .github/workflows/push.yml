        run: ./build -k -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}

  # ---- noble (Ubuntu 24.04, 6.8.0-* generic + 5.0/5.11/6.11/6.14/6.17 cloud) ---
