  build_kernel:
    name: Build Kernel
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zfs:
          - 0.8.2
          - 2.0.4
        kernel:
          # LinuxKit variants - Container-optimized kernels from Docker
          # https://github.com/linuxkit/linuxkit
          - 6.6.71-linuxkit   # LinuxKit 6.6.71 LTS (current stable)
          - 6.6.13-linuxkit   # LinuxKit 6.6.13 LTS (current)
          - 5.15.27-linuxkit  # LinuxKit 5.15.27 LTS (legacy)
          - 5.10.104-linuxkit # LinuxKit 5.10.104 LTS (legacy supported)
          
          # Ubuntu variants - Actual available kernel versions
          # https://ubuntu.com/about/release-cycle
          # Ubuntu 24.04 LTS (Noble Numbat) - Supported until April 2029
          - 6.8.0-85-generic  # Ubuntu 24.04 LTS generic kernel (latest available)
          - 6.8.0-84-generic  # Ubuntu 24.04 LTS generic kernel (recent)
          
          # Ubuntu 22.04 LTS (Jammy Jellyfish) - Supported until April 2027
          - 6.8.0-85-generic  # Ubuntu 22.04 LTS HWE kernel (latest available)
          - 5.15.0-97-generic # Ubuntu 22.04 LTS generic kernel (latest available)
          
          # Ubuntu 20.04 LTS (Focal Fossa) - Supported until May 2025
          - 5.8.0-63-generic  # Ubuntu 20.04 LTS HWE kernel (latest available)
          - 5.4.0-99-generic  # Ubuntu 20.04 LTS base kernel (latest available)
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build -b ${{ secrets.s3_url }} -k -z ${{ matrix.zfs }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
