name: Push

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-zfs-version:
    name: Resolve ZFS Version
    runs-on: ubuntu-latest
    outputs:
      zfs_version: ${{ steps.resolve.outputs.zfs_version }}
    steps:
      - name: Determine ZFS version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Authenticated request: unauthenticated calls share the runner
          # IP's 60/hr rate limit and intermittently return an error object,
          # which once produced an empty version and a full bogus matrix.
          LATEST=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/openzfs/zfs/releases | \
            jq -r '[.[] | select(.prerelease == false)] | first | .tag_name' | sed 's/^zfs-//')
          if [[ ! $LATEST =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Failed to resolve ZFS version (got: '$LATEST')" >&2
            exit 1
          fi
          echo "zfs_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest stable ZFS: $LATEST"

  discover-kernels:
    name: Discover missing (arch, kernel) build pairs
    needs: [resolve-zfs-version]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    us-west-2
    outputs:
      jammy:    ${{ steps.bucket.outputs.jammy }}
      noble:    ${{ steps.bucket.outputs.noble }}
      resolute: ${{ steps.bucket.outputs.resolute }}
      userland: ${{ steps.bucket.outputs.userland }}
    steps:
      - uses: actions/checkout@v7
      - name: Bucket src/ kernels by codename, filter by archive availability and S3 state
        id: bucket
        shell: bash
        run: |
          set -euo pipefail
          ZV="${{ needs.resolve-zfs-version.outputs.zfs_version }}"
          # Refuse to discover against a malformed version — an empty ZV
          # would make every artifact look missing and spawn a full matrix.
          if [[ ! $ZV =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid zfs_version: '$ZV'" >&2
            exit 1
          fi

          # Mirrors ubuntu_codename_for_kernel() in zfs-builder/src/ubuntu.sh
          # and the Ubuntu Kernel Monitor workflow. Keep these three in sync.
          codename_for() {
            case $1 in
              5.15.0-*-generic)  echo jammy ;;
              6.8.0-*-generic)   echo noble ;;
              7.0.0-*-generic)   echo resolute ;;
              5.15.0-*-azure|5.15.0-*-aws|5.15.0-*-gcp)     echo jammy ;;
              *-azure|*-aws|*-gcp)                          echo noble ;;
            esac
          }

          # Step 1: fetch the set of artifacts already published for this ZFS
          # version. Pairs whose archive already exists produce no build job;
          # the archive_exists check inside ./build remains as a safety net.
          # A listing failure fails this job (and thus skips all builds)
          # rather than silently rebuilding the world.
          EXISTING=$(aws s3api list-objects-v2 --bucket "${{ secrets.s3_bucket }}" \
            --prefix "zfs-${ZV}-" --query 'Contents[].Key' --output text | tr '\t' '\n')
          echo "S3 artifacts for zfs-$ZV: $(echo "$EXISTING" | grep -c . || true)"
          in_s3() { grep -qxF "$1" <<< "$EXISTING"; }

          # Step 2: query each codename's package archive per-arch and collect
          # the set of kernel package names actually available there. Cloud
          # variants (azure, aws, gcp) have arch-specific publication
          # histories — e.g. some 6.x azure builds existed on amd64
          # months before the matching arm64 packages landed. We must
          # respect those gaps or builds break with "Unable to locate
          # package".
          declare -A AVAIL
          for codename in jammy noble resolute; do
            for arch in amd64 arm64; do
              case $arch in
                amd64|i386)
                  host_updates=http://archive.ubuntu.com/ubuntu
                  host_security=http://security.ubuntu.com/ubuntu
                  ;;
                *)
                  host_updates=http://ports.ubuntu.com/ubuntu-ports
                  host_security=http://ports.ubuntu.com/ubuntu-ports
                  ;;
              esac
              FOUND=""
              for url in \
                "${host_updates}/dists/${codename}-updates/main/binary-${arch}/Packages.gz" \
                "${host_security}/dists/${codename}-security/main/binary-${arch}/Packages.gz"; do
                tmpfile=$(mktemp)
                if curl -sLf "$url" > "$tmpfile" 2>/dev/null; then
                  pkgs=$(gunzip -c "$tmpfile" | \
                    grep -oE '^Package: linux-image-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-(generic|azure|aws|gcp)$' | \
                    sed 's/^Package: linux-image-//' || true)
                  FOUND+=" $pkgs"
                fi
                rm -f "$tmpfile"
              done
              AVAIL[$codename:$arch]=$(echo "$FOUND" | tr ' ' '\n' | grep -v '^$' | sort -uV | tr '\n' ' ')
            done
          done

          # Step 3: bucket src/ contents by codename.
          declare -A BUCKET
          BUCKET[jammy]=""; BUCKET[noble]=""; BUCKET[resolute]=""
          for d in src/*/; do
            k=$(basename "$d")
            [[ $k =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-(generic|azure|aws|gcp)$ ]] || continue
            cn=$(codename_for "$k")
            [[ -z $cn ]] && continue
            BUCKET[$cn]+=" $k"
          done

          # Step 4: emit per-codename JSON arrays of {arch, kernel} include
          # entries for KERNEL builds. Each pair is included only when the
          # kernel is in that codename's arch archive AND its artifact is not
          # already in S3. Kernels in src/ that don't appear in any arch's
          # archive (e.g. dormant pre-LTS variants) are logged as orphans.
          # Also track a representative buildable kernel per arch for the
          # userland matrix below.
          declare -A REP
          for codename in jammy noble resolute; do
            kernels=${BUCKET[$codename]:-}
            entries=()
            orphans=()
            skipped=0
            for k in $kernels; do
              found_any=0
              for arch in amd64 arm64; do
                if [[ " ${AVAIL[$codename:$arch]} " == *" $k "* ]]; then
                  found_any=1
                  [[ -z ${REP[$arch]:-} ]] && REP[$arch]=$k
                  if in_s3 "zfs-$ZV-$k-$arch.tar.gz"; then
                    skipped=$((skipped+1))
                  else
                    entries+=("{\"arch\":\"$arch\",\"kernel\":\"$k\"}")
                  fi
                fi
              done
              [[ $found_any -eq 0 ]] && orphans+=("$k")
            done

            if [[ ${#entries[@]} -eq 0 ]]; then
              json='[]'
            else
              old_ifs=$IFS; IFS=,
              json="[${entries[*]}]"
              IFS=$old_ifs
            fi

            src_count=$(echo "$kernels" | tr ' ' '\n' | grep -v '^$' | wc -l)
            echo "$codename: src=$src_count, to build=${#entries[@]}, already in S3=$skipped, orphans=${#orphans[@]}"
            for o in "${orphans[@]}"; do
              echo "  orphan (in src/, not in $codename archive any arch): $o"
            done
            echo "$codename=$json" >> "$GITHUB_OUTPUT"
          done

          # Step 5: userland matrix. The userland archive name is
          # zfs-<version>-userland-<arch>.tar.gz — it has no kernel component,
          # so exactly one build per arch is needed (previously one job per
          # (arch, kernel) pair raced to produce the same file). Each arch
          # builds against a representative kernel from src/.
          u_entries=()
          for arch in amd64 arm64; do
            if ! in_s3 "zfs-$ZV-userland-$arch.tar.gz"; then
              if [[ -n ${REP[$arch]:-} ]]; then
                u_entries+=("{\"arch\":\"$arch\",\"kernel\":\"${REP[$arch]}\"}")
              else
                echo "userland: no buildable kernel found for $arch, cannot build"
              fi
            fi
          done
          if [[ ${#u_entries[@]} -eq 0 ]]; then
            u_json='[]'
          else
            old_ifs=$IFS; IFS=,
            u_json="[${u_entries[*]}]"
            IFS=$old_ifs
          fi
          echo "userland: to build=${#u_entries[@]}"
          echo "userland=$u_json" >> "$GITHUB_OUTPUT"

  # Userland is built once per arch (see Step 5 above), natively on
  # arch-matched runners — no QEMU emulation.
  build_userland:
    name: Build Userland (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }})
    needs: [resolve-zfs-version, discover-kernels]
    if: needs.discover-kernels.outputs.userland != '[]'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-kernels.outputs.userland) }}
    steps:
      - uses: actions/checkout@v7
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ matrix.arch }} ditdotdev/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: ./build -u -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}

  # ---- jammy (Ubuntu 22.04, 5.15.0-* generic + cloud) ---------------------
  build_kernel_jammy:
    name: Build Kernel jammy (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernel }})
    needs: [resolve-zfs-version, discover-kernels]
    if: needs.discover-kernels.outputs.jammy != '[]'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-kernels.outputs.jammy) }}
    steps:
      - uses: actions/checkout@v7
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ matrix.arch }} ditdotdev/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: ./build -k -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}

  # ---- noble (Ubuntu 24.04, 6.8.0-* generic + 5.0/5.11/6.11/6.14/6.17 cloud) ---
  build_kernel_noble:
    name: Build Kernel noble (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernel }})
    needs: [resolve-zfs-version, discover-kernels]
    if: needs.discover-kernels.outputs.noble != '[]'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-kernels.outputs.noble) }}
    steps:
      - uses: actions/checkout@v7
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ matrix.arch }} ditdotdev/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: ./build -k -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}

  # ---- resolute (Ubuntu 26.04, 7.0.0-* generic) ---------------------------
  build_kernel_resolute:
    name: Build Kernel resolute (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernel }})
    needs: [resolve-zfs-version, discover-kernels]
    if: needs.discover-kernels.outputs.resolute != '[]'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-kernels.outputs.resolute) }}
    steps:
      - uses: actions/checkout@v7
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ matrix.arch }} ditdotdev/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: ./build -k -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}
