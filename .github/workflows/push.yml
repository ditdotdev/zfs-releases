name: Push

on: push

permissions:
  contents: read

jobs:
  build_userland:
    name: Build Userland (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            kernel: 6.6.71-linuxkit
            zfs: 2.3.4
          - arch: amd64
            runner: ubuntu-latest
            kernel: 6.6.71-linuxkit
            zfs: 2.2.8
          - arch: arm64
            runner: macos-14
            kernel: 6.8.0-64-generic
            zfs: 2.3.4
          - arch: arm64
            runner: macos-14
            kernel: 6.8.0-64-generic
            zfs: 2.2.8
    steps:
      - uses: actions/checkout@v4
      - name: Install Docker on macOS
        if: runner.os == 'macOS'
        run: |
          brew install qemu
          brew install colima 
          brew install docker docker-buildx

          # Start Colima with QEMU (no HVF needed)
          colima start --arch aarch64 --vm-type=qemu --cpu 4 --memory 8 --disk 50
      - name: Checkout zfs-builder
        uses: actions/checkout@v4
        with:
          repository: datadatdat/zfs-builder
          token: ${{ secrets.GO_MODULES_TOKEN }}
          path: zfs-builder
      - name: Build zfs-builder image
        run: |
          cd zfs-builder
          docker build -t datadatdat/zfs-builder:latest .
      - name: Build
        run: ./build -b ${{ secrets.s3_url }} -z ${{ matrix.zfs }} ${{ matrix.kernel }}
      - name: Rename userland with arch suffix
        run: |
          cd out/archive
          if [ -f "zfs-${{ matrix.zfs }}-userland.tar.gz" ]; then
            mv "zfs-${{ matrix.zfs }}-userland.tar.gz" "zfs-${{ matrix.zfs }}-userland-${{ matrix.arch }}.tar.gz"
          fi
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  build_kernel:
    name: Build Kernel (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD64 builds on ubuntu-latest
          - arch: amd64
            runner: ubuntu-latest
            zfs: 2.3.4
            kernel: 6.6.71-linuxkit
          - arch: amd64
            runner: ubuntu-latest
            zfs: 2.3.4
            kernel: 6.6.13-linuxkit
          - arch: amd64
            runner: ubuntu-latest
            zfs: 2.3.4
            kernel: 5.15.27-linuxkit
          - arch: amd64
            runner: ubuntu-latest
            zfs: 2.3.4
            kernel: 5.10.104-linuxkit
          - arch: amd64
            runner: ubuntu-latest
            zfs: 2.3.4
            kernel: 5.15.0-25-generic
          - arch: amd64
            runner: ubuntu-latest
            zfs: 2.3.4
            kernel: 6.8.0-64-generic
          - arch: amd64
            runner: ubuntu-latest
            zfs: 2.2.8
            kernel: 6.6.71-linuxkit
          - arch: amd64
            runner: ubuntu-latest
            zfs: 2.2.8
            kernel: 6.6.13-linuxkit
          - arch: amd64
            runner: ubuntu-latest
            zfs: 2.2.8
            kernel: 5.15.27-linuxkit
          - arch: amd64
            runner: ubuntu-latest
            zfs: 2.2.8
            kernel: 5.10.104-linuxkit
          - arch: amd64
            runner: ubuntu-latest
            zfs: 2.2.8
            kernel: 5.15.0-25-generic
          - arch: amd64
            runner: ubuntu-latest
            zfs: 2.2.8
            kernel: 6.8.0-64-generic
          # ARM64 builds on macos-14 (Apple Silicon)
          - arch: arm64
            runner: macos-14
            zfs: 2.3.4
            kernel: 6.8.0-64-generic
          - arch: arm64
            runner: macos-14
            zfs: 2.2.8
            kernel: 6.8.0-64-generic
    steps:
      - uses: actions/checkout@v4
      - name: Install Docker on macOS
        if: runner.os == 'macOS'
        run: |
          brew install qemu
          brew install colima
          brew install docker docker-buildx
          
          # Start Colima with QEMU (no HVF needed)
          colima start --arch aarch64 --vm-type=qemu --cpu 4 --memory 8 --disk 50
      - name: Checkout zfs-builder
        uses: actions/checkout@v4
        with:
          repository: datadatdat/zfs-builder
          token: ${{ secrets.GO_MODULES_TOKEN }}
          path: zfs-builder
      - name: Build zfs-builder image
        run: |
          cd zfs-builder
          docker build -t datadatdat/zfs-builder:latest .
      - name: Build
        run: ./build -b ${{ secrets.s3_url }} -k -z ${{ matrix.zfs }} ${{ matrix.kernel }}
      - name: Rename kernel modules with arch suffix
        run: |
          cd out/archive
          if [ -f "zfs-${{ matrix.zfs }}-${{ matrix.kernel }}.tar.gz" ]; then
            mv "zfs-${{ matrix.zfs }}-${{ matrix.kernel }}.tar.gz" "zfs-${{ matrix.zfs }}-${{ matrix.kernel }}-${{ matrix.arch }}.tar.gz"
          fi
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
