name: Push

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-zfs-version:
    name: Resolve ZFS Version
    runs-on: ubuntu-latest
    outputs:
      zfs_version: ${{ steps.resolve.outputs.zfs_version }}
    steps:
      - name: Determine ZFS version
        id: resolve
        run: |
          LATEST=$(curl -s https://api.github.com/repos/openzfs/zfs/releases | \
            jq -r '[.[] | select(.prerelease == false)] | first | .tag_name' | sed 's/^zfs-//')
          echo "zfs_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest stable ZFS: $LATEST"

  discover-kernels:
    name: Discover kernels by codename
    runs-on: ubuntu-latest
    outputs:
      focal:    ${{ steps.bucket.outputs.focal }}
      jammy:    ${{ steps.bucket.outputs.jammy }}
      noble:    ${{ steps.bucket.outputs.noble }}
      resolute: ${{ steps.bucket.outputs.resolute }}
    steps:
      - uses: actions/checkout@v6
      - name: Bucket src/ kernels by Ubuntu codename
        id: bucket
        shell: bash
        run: |
          set -euo pipefail
          # Mirrors ubuntu_codename_for_kernel() in zfs-builder/src/ubuntu.sh
          # and the Ubuntu Kernel Monitor workflow. Keep these three in sync.
          codename_for() {
            case $1 in
              5.4.0-*-generic)   echo focal ;;
              5.15.0-*-generic)  echo jammy ;;
              6.8.0-*-generic)   echo noble ;;
              7.0.0-*-generic)   echo resolute ;;
              5.4.0-*-azure|5.4.0-*-aws|5.4.0-*-gcp)        echo focal ;;
              5.15.0-*-azure|5.15.0-*-aws|5.15.0-*-gcp)     echo jammy ;;
              *-azure|*-aws|*-gcp)                          echo noble ;;
            esac
          }

          declare -A bucket
          bucket[focal]=""; bucket[jammy]=""; bucket[noble]=""; bucket[resolute]=""

          for d in src/*/; do
            kernel=$(basename "$d")
            [[ $kernel =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-(generic|azure|aws|gcp)$ ]] || continue
            codename=$(codename_for "$kernel")
            [[ -z $codename ]] && continue
            bucket[$codename]+="$kernel "
          done

          for codename in focal jammy noble resolute; do
            kernels=${bucket[$codename]}
            if [[ -z ${kernels// } ]]; then
              json='[]'
            else
              json=$(echo "$kernels" | tr ' ' '\n' | grep -v '^$' | sort -uV | jq -R . | jq -sc .)
            fi
            count=$(echo "$json" | jq 'length')
            echo "$codename: $count kernels"
            echo "$codename=$json" >> "$GITHUB_OUTPUT"
          done

  # ---- focal (Ubuntu 20.04, 5.4.0-* generic + cloud) ----------------------
  build_userland_focal:
    name: Build Userland focal (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernel }})
    needs: [resolve-zfs-version, discover-kernels]
    if: needs.discover-kernels.outputs.focal != '[]'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        kernel: ${{ fromJSON(needs.discover-kernels.outputs.focal) }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ matrix.arch }} datadatdat/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: ./build -u -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}

  build_kernel_focal:
    name: Build Kernel focal (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernel }})
    needs: [resolve-zfs-version, discover-kernels]
    if: needs.discover-kernels.outputs.focal != '[]'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        kernel: ${{ fromJSON(needs.discover-kernels.outputs.focal) }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ matrix.arch }} datadatdat/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: ./build -k -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}

  # ---- jammy (Ubuntu 22.04, 5.15.0-* generic + cloud) ---------------------
