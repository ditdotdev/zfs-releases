name: Push

on: push

permissions:
  contents: read

jobs:
  # build_userland:
  #   name: Build Userland
  #   if: startsWith(github.ref, 'refs/heads/')
  #   runs-on: ubuntu-latest
  #   strategy:
  #     matrix:
  #       zfs:
  #         - 0.8.2
  #         - 2.0.4
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Build
  #       run: ./build -b ${{ secrets.s3_url }} -z ${{ matrix.zfs }} 4.9.184-linuxkit
  #     - name: Publish
  #       run: ./publish ${{ secrets.s3_bucket }}
  #       env:
  #         AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  #         AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  build_kernel:
    name: Build Kernel
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zfs:
          - 0.8.2
          - 2.0.4
        kernel:
          # LinuxKit variants - Container-optimized kernels from Docker
          # https://github.com/linuxkit/linuxkit
          - 6.6.71-linuxkit   # LinuxKit 6.6.71 LTS (current stable)
          - 6.6.13-linuxkit   # LinuxKit 6.6.13 LTS (current)
          - 5.15.27-linuxkit  # LinuxKit 5.15.27 LTS (legacy)
          - 5.10.104-linuxkit # LinuxKit 5.10.104 LTS (legacy supported)
          
          # Ubuntu variants - Current LTS releases
          # https://ubuntu.com/about/release-cycle
          # Ubuntu 24.04 LTS (Noble Numbat) - Supported until April 2029
          - 6.8.0-49-generic  # Ubuntu 24.04 LTS generic kernel
          - 6.8.0-1014-gcp    # Ubuntu 24.04 LTS GCP-optimized kernel
          - 6.8.0-1018-aws    # Ubuntu 24.04 LTS AWS-optimized kernel
          
          # Ubuntu 22.04 LTS (Jammy Jellyfish) - Supported until April 2027
          - 5.15.0-125-generic # Ubuntu 22.04 LTS generic kernel
          - 5.15.0-1071-gcp    # Ubuntu 22.04 LTS GCP-optimized kernel
          - 5.15.0-1076-aws    # Ubuntu 22.04 LTS AWS-optimized kernel
          
          # Ubuntu 20.04 LTS (Focal Fossa) - Supported until May 2025
          - 5.4.0-196-generic  # Ubuntu 20.04 LTS generic kernel
          - 5.4.0-1128-gcp     # Ubuntu 20.04 LTS GCP-optimized kernel
          - 5.4.0-1132-aws     # Ubuntu 20.04 LTS AWS-optimized kernel
          
          # WSL variants - Windows Subsystem for Linux 2 kernels
          # https://github.com/microsoft/WSL2-Linux-Kernel
          - 6.6.87.2-microsoft-standard # WSL2 6.6.87.2 (current stable, June 2025)
          - 5.15.167.4-microsoft-standard # WSL2 5.15.167.4 (LTS, November 2024)
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build -b ${{ secrets.s3_url }} -k -z ${{ matrix.zfs }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
