name: Push

on: push

permissions:
  contents: read

jobs:
  # Temporarily commenting out build_userland - will re-enable after kernel builds are stable
  # build_userland:
  name: Build Userland
  if: startsWith(github.ref, 'refs/heads/')
  runs-on: ubuntu-latest
  strategy:
    fail-fast: false
    matrix:
      zfs:
        - 2.3.4
        - 2.2.8
  steps:
    - uses: actions/checkout@v4
    - name: Build
      run: ./build -b ${{ secrets.s3_url }} -z ${{ matrix.zfs }} 4.9.184-linuxkit
    - name: Publish
      run: ./publish ${{ secrets.s3_bucket }}
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  build_kernel:
    name: Build Kernel
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zfs:
          - 2.3.4
          - 2.2.8
        kernel:
          # LinuxKit variants - Container-optimized kernels from Docker
          # https://github.com/linuxkit/linuxkit
          # All versions >= 4.18 (minimum required by ZFS 2.3.4/2.2.8)
          - 6.6.71-linuxkit   # LinuxKit 6.6.71 LTS (current stable)
          - 6.6.13-linuxkit   # LinuxKit 6.6.13 LTS (current)
          - 5.15.27-linuxkit  # LinuxKit 5.15.27 LTS (legacy)
          - 5.10.104-linuxkit # LinuxKit 5.10.104 LTS (legacy supported)

          # Ubuntu LTS variants - Base repository kernels (guaranteed availability)
          # https://ubuntu.com/about/release-cycle
          # Using only base kernels from main repos (not cloud-specific variants)
          # NOTE: Build container uses Ubuntu 22.04, so only kernels available in
          # the 22.04 repos (jammy) can be installed. Ubuntu 20.04 and 24.04 kernels
          # are not available in the 22.04 package repositories.
          
          # Ubuntu 22.04 LTS (Jammy Jellyfish) - Supported until April 2027
          - 5.15.0-25-generic # Ubuntu 22.04 LTS base kernel (available in jammy repos)
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build -b ${{ secrets.s3_url }} -k -z ${{ matrix.zfs }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
