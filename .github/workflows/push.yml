name: Push

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-zfs-version:
    name: Resolve ZFS Version
    runs-on: ubuntu-latest
    outputs:
      zfs_version: ${{ steps.resolve.outputs.zfs_version }}
    steps:
      - name: Determine ZFS version
        id: resolve
        run: |
          LATEST=$(curl -s https://api.github.com/repos/openzfs/zfs/releases | \
            jq -r '[.[] | select(.prerelease == false)] | first | .tag_name' | sed 's/^zfs-//')
          echo "zfs_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest stable ZFS: $LATEST"

  discover-kernels:
    name: Discover (arch, kernel) pairs by codename
    runs-on: ubuntu-latest
    outputs:
      jammy:    ${{ steps.bucket.outputs.jammy }}
      noble:    ${{ steps.bucket.outputs.noble }}
      resolute: ${{ steps.bucket.outputs.resolute }}
    steps:
      - uses: actions/checkout@v7
      - name: Bucket src/ kernels by codename and filter by per-arch archive availability
        id: bucket
        shell: bash
        run: |
          set -euo pipefail
          # Mirrors ubuntu_codename_for_kernel() in zfs-builder/src/ubuntu.sh
          # and the Ubuntu Kernel Monitor workflow. Keep these three in sync.
          codename_for() {
            case $1 in
              5.15.0-*-generic)  echo jammy ;;
              6.8.0-*-generic)   echo noble ;;
              7.0.0-*-generic)   echo resolute ;;
              5.15.0-*-azure|5.15.0-*-aws|5.15.0-*-gcp)     echo jammy ;;
              *-azure|*-aws|*-gcp)                          echo noble ;;
            esac
          }

          # Step 1: query each codename's archive per-arch and collect the
          # set of kernel package names actually available there. Cloud
          # variants (azure, aws, gcp) have arch-specific publication
          # histories — e.g. some 6.x azure builds existed on amd64
          # months before the matching arm64 packages landed. We must
          # respect those gaps or builds break with "Unable to locate
          # package".
          declare -A AVAIL
          for codename in jammy noble resolute; do
            for arch in amd64 arm64; do
              case $arch in
                amd64|i386)
                  host_updates=http://archive.ubuntu.com/ubuntu
                  host_security=http://security.ubuntu.com/ubuntu
                  ;;
                *)
                  host_updates=http://ports.ubuntu.com/ubuntu-ports
                  host_security=http://ports.ubuntu.com/ubuntu-ports
                  ;;
              esac
              FOUND=""
              for url in \
                "${host_updates}/dists/${codename}-updates/main/binary-${arch}/Packages.gz" \
                "${host_security}/dists/${codename}-security/main/binary-${arch}/Packages.gz"; do
                tmpfile=$(mktemp)
                if curl -sLf "$url" > "$tmpfile" 2>/dev/null; then
                  pkgs=$(gunzip -c "$tmpfile" | \
                    grep -oE '^Package: linux-image-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-(generic|azure|aws|gcp)$' | \
                    sed 's/^Package: linux-image-//' || true)
                  FOUND+=" $pkgs"
                fi
                rm -f "$tmpfile"
              done
              AVAIL[$codename:$arch]=$(echo "$FOUND" | tr ' ' '\n' | grep -v '^$' | sort -uV | tr '\n' ' ')
            done
          done

          # Step 2: bucket src/ contents by codename.
          declare -A BUCKET
          BUCKET[jammy]=""; BUCKET[noble]=""; BUCKET[resolute]=""
          for d in src/*/; do
            k=$(basename "$d")
            [[ $k =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-(generic|azure|aws|gcp)$ ]] || continue
            cn=$(codename_for "$k")
            [[ -z $cn ]] && continue
            BUCKET[$cn]+=" $k"
          done

          # Step 3: emit per-codename JSON arrays of {arch, kernel} include
          # entries. Each pair is included only when the kernel is actually
          # in that codename's arch archive. Kernels in src/ that don't
          # appear in any arch's archive (e.g. dormant pre-LTS variants)
          # are logged as orphans and produce no build jobs.
          for codename in jammy noble resolute; do
            kernels=${BUCKET[$codename]:-}
            entries=()
            orphans=()
            for k in $kernels; do
              found_any=0
              for arch in amd64 arm64; do
                if [[ " ${AVAIL[$codename:$arch]} " == *" $k "* ]]; then
                  entries+=("{\"arch\":\"$arch\",\"kernel\":\"$k\"}")
                  found_any=1
                fi
              done
              [[ $found_any -eq 0 ]] && orphans+=("$k")
            done

            if [[ ${#entries[@]} -eq 0 ]]; then
              json='[]'
            else
              old_ifs=$IFS; IFS=,
              json="[${entries[*]}]"
              IFS=$old_ifs
            fi

            src_count=$(echo "$kernels" | tr ' ' '\n' | grep -v '^$' | wc -l)
            echo "$codename: src=$src_count, build pairs=${#entries[@]}, orphans=${#orphans[@]}"
            for o in "${orphans[@]}"; do
              echo "  orphan (in src/, not in $codename archive any arch): $o"
            done
            echo "$codename=$json" >> "$GITHUB_OUTPUT"
          done

  # ---- jammy (Ubuntu 22.04, 5.15.0-* generic + cloud) ---------------------
  build_userland_jammy:
    name: Build Userland jammy (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernel }})
    needs: [resolve-zfs-version, discover-kernels]
    if: needs.discover-kernels.outputs.jammy != '[]'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-kernels.outputs.jammy) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ matrix.arch }} ditdotdev/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: ./build -u -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}

  build_kernel_jammy:
    name: Build Kernel jammy (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernel }})
    needs: [resolve-zfs-version, discover-kernels]
    if: needs.discover-kernels.outputs.jammy != '[]'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-kernels.outputs.jammy) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ matrix.arch }} ditdotdev/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: ./build -k -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}

  # ---- noble (Ubuntu 24.04, 6.8.0-* generic + 5.0/5.11/6.11/6.14/6.17 cloud) ---
  build_userland_noble:
    name: Build Userland noble (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernel }})
    needs: [resolve-zfs-version, discover-kernels]
    if: needs.discover-kernels.outputs.noble != '[]'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-kernels.outputs.noble) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ matrix.arch }} ditdotdev/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: ./build -u -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}

  build_kernel_noble:
    name: Build Kernel noble (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernel }})
    needs: [resolve-zfs-version, discover-kernels]
    if: needs.discover-kernels.outputs.noble != '[]'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-kernels.outputs.noble) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ matrix.arch }} ditdotdev/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: ./build -k -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}

  # ---- resolute (Ubuntu 26.04, 7.0.0-* generic; kernel module build will
  #               fail until OpenZFS ships 7.x support, tracked in #86) -----
  build_userland_resolute:
    name: Build Userland resolute (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernel }})
    needs: [resolve-zfs-version, discover-kernels]
    if: needs.discover-kernels.outputs.resolute != '[]'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-kernels.outputs.resolute) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ matrix.arch }} ditdotdev/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: ./build -u -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}

  build_kernel_resolute:
    name: Build Kernel resolute (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernel }})
    needs: [resolve-zfs-version, discover-kernels]
    if: needs.discover-kernels.outputs.resolute != '[]'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-kernels.outputs.resolute) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ matrix.arch }} ditdotdev/zfs-builder:latest
