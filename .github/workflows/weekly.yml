name: Weekly Kernel Check

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-zfs-version:
    name: Resolve ZFS Version
    runs-on: ubuntu-latest
    outputs:
      zfs_version: ${{ steps.resolve.outputs.zfs_version }}
    steps:
      - name: Determine ZFS version
        id: resolve
        run: |
          LATEST=$(curl -s https://api.github.com/repos/openzfs/zfs/releases | \
            jq -r '[.[] | select(.prerelease == false)] | first | .tag_name' | sed 's/^zfs-//')
          echo "zfs_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest stable ZFS: $LATEST"

  build_image:
    name: Build ZFS Builder Image (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Checkout zfs-builder
        uses: actions/checkout@v6
        with:
          repository: datadatdat/zfs-builder
          token: ${{ secrets.GO_MODULES_TOKEN }}
      - name: Build zfs-builder image
        run: docker buildx build --platform ${{ matrix.platform }} --load -t datadatdat/zfs-builder:latest .
      - name: Save Docker image
        run: docker save datadatdat/zfs-builder:latest | gzip > zfs-builder.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: zfs-builder-${{ matrix.arch }}
          path: zfs-builder.tar.gz
          retention-days: 1

  build_userland:
    name: Build Userland (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernel }})
    needs: [build_image, resolve-zfs-version]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
        kernel:
          - 6.8.0-64-generic
          - 6.8.0-88-generic
          - 6.8.0-90-generic
          - 6.8.0-94-generic
        include:
          # LinuxKit kernel is amd64 only
          - arch: amd64
            kernel: 6.6.71-linuxkit
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Download zfs-builder image
        uses: actions/download-artifact@v8
        with:
          name: zfs-builder-${{ matrix.arch }}
      - name: Load Docker image
        run: gunzip -c zfs-builder.tar.gz | docker load
      - name: Build
        run: ./build -u -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}

  build_kernel:
    name: Build Kernel (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernel }})
    needs: [build_image, resolve-zfs-version]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
        kernel:
          - 6.8.0-64-generic
          - 6.8.0-88-generic
          - 6.8.0-90-generic
          - 6.8.0-94-generic
        include:
          # LinuxKit kernels are amd64 only
          - arch: amd64
            kernel: 6.6.71-linuxkit
          - arch: amd64
            kernel: 6.6.13-linuxkit
          - arch: amd64
            kernel: 5.15.27-linuxkit
          - arch: amd64
            kernel: 5.10.104-linuxkit
          - arch: amd64
            kernel: 6.8.0-64-generic
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Download zfs-builder image
        uses: actions/download-artifact@v8
        with:
          name: zfs-builder-${{ matrix.arch }}
      - name: Load Docker image
        run: gunzip -c zfs-builder.tar.gz | docker load
      - name: Build
        run: ./build -k -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}

  get_kernels_ubuntu-24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
      - name: Setup GO environment
        run: |
          go mod download
      - id: set-matrix
        run: echo "matrix=$(go run cmd/kernels/kernels.go -l ubuntu24)" >> $GITHUB_OUTPUT
        env:
          GITHUB_PAT: ${{ secrets.REPO_TOKEN }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  build_kernel_ubuntu-24:
    name: Build Kernel (${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernels }}, amd64)
    needs:
      - build_image
      - get_kernels_ubuntu-24
      - resolve-zfs-version
    if: startsWith(github.ref, 'refs/heads/') && needs.get_kernels_ubuntu-24.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        kernels: ${{ fromJson(needs.get_kernels_ubuntu-24.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Download zfs-builder image
        uses: actions/download-artifact@v8
        with:
          name: zfs-builder-amd64
      - name: Load Docker image
        run: gunzip -c zfs-builder.tar.gz | docker load
      - name: Build
        run: ./build -k -b ${{ secrets.s3_bucket }} -a amd64 -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernels }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}
