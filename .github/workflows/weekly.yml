name: Weekly Kernel Check

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-zfs-version:
    name: Resolve ZFS Version
    runs-on: ubuntu-latest
    outputs:
      zfs_version: ${{ steps.resolve.outputs.zfs_version }}
    steps:
      - name: Determine ZFS version
        id: resolve
        run: |
          LATEST=$(curl -s https://api.github.com/repos/openzfs/zfs/releases | \
            jq -r '[.[] | select(.prerelease == false)] | first | .tag_name' | sed 's/^zfs-//')
          echo "zfs_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest stable ZFS: $LATEST"

  build_userland:
    name: Build Userland (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernel }})
    needs: [resolve-zfs-version]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
        kernel:
          - 6.8.0-64-generic
          - 6.8.0-88-generic
          - 6.8.0-90-generic
          - 6.8.0-94-generic
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ matrix.arch }} ditdotdev/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: ./build -u -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}

  build_kernel:
    name: Build Kernel (${{ matrix.arch }}, ${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernel }})
    needs: [resolve-zfs-version]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
        kernel:
          - 6.8.0-64-generic
          - 6.8.0-88-generic
          - 6.8.0-90-generic
          - 6.8.0-94-generic
        include:
          - arch: amd64
            kernel: 6.8.0-64-generic
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ matrix.arch }} ditdotdev/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: ./build -k -b ${{ secrets.s3_bucket }} -a ${{ matrix.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}

  get_kernels_ubuntu-24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
      - name: Setup GO environment
        run: |
          go mod download
      - id: set-matrix
        run: echo "matrix=$(go run cmd/kernels/kernels.go -l ubuntu24)" >> $GITHUB_OUTPUT
        env:
          GITHUB_PAT: ${{ secrets.REPO_TOKEN }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  build_kernel_ubuntu-24:
    name: Build Kernel (${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ matrix.kernels }}, amd64)
    needs:
      - get_kernels_ubuntu-24
      - resolve-zfs-version
    if: startsWith(github.ref, 'refs/heads/') && needs.get_kernels_ubuntu-24.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        kernels: ${{ fromJson(needs.get_kernels_ubuntu-24.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Pull zfs-builder image
        run: docker pull --platform linux/amd64 ditdotdev/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: ./build -k -b ${{ secrets.s3_bucket }} -a amd64 -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ matrix.kernels }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}
