name: Ubuntu 22.04 Kernel Monitor

on:
  schedule:
    - cron: '0 12 * * *'  # Run daily at noon UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check_ubuntu_kernels:
    name: Check for new Ubuntu 22.04 (Jammy) kernels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Fetch Ubuntu 22.04 release page and check for new kernels
        id: fetch
        run: |
          # Get recent jammy releases (past 3 months)
          CUTOFF_DATE=$(date -d '3 months ago' +%Y%m%d)
          RELEASES=$(curl -s https://cloud-images.ubuntu.com/releases/jammy/ | \
            grep -oP 'release-\d{8}' | sort -u | \
            awk -v cutoff="$CUTOFF_DATE" '$0 >= "release-" cutoff')
          
          echo "Checking recent releases:"
          echo "$RELEASES"
          
          # Extract kernel versions from riscv64 manifests
          KERNELS=""
          for release in $RELEASES; do
            kernel=$(curl -s "https://cloud-images.ubuntu.com/releases/jammy/$release/ubuntu-22.04-server-cloudimg-riscv64.manifest" 2>/dev/null | \
              grep "^linux-image-6\.8\.0-[0-9]*-generic" | head -1 | \
              awk '{print $1}' | sed 's/linux-image-//' || true)
            if [ -n "$kernel" ]; then
              KERNELS="${KERNELS}${kernel}\n"
            fi
          done
          
          # Deduplicate and sort
          KERNELS=$(echo -e "$KERNELS" | sort -u)
          
          echo "Found kernels in jammy releases:"
          echo "$KERNELS"
          
          # Get existing kernels from src/ directory
          EXISTING=$(ls -1 src/ | grep '^6\.8\.0-.*-generic$' || true)
          
          echo "Existing kernels in src/:"
          echo "$EXISTING"
          
          # Find new kernels
          NEW_KERNELS=""
          for kernel in $KERNELS; do
            if ! echo "$EXISTING" | grep -q "^${kernel}$"; then
              NEW_KERNELS="${NEW_KERNELS}${kernel}\n"
            fi
          done
          
          if [ -n "$NEW_KERNELS" ]; then
            echo "new_kernels<<EOF" >> $GITHUB_OUTPUT
            echo -e "$NEW_KERNELS" | grep -v '^$' >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_new=true" >> $GITHUB_OUTPUT
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create issue for new kernels
        if: steps.fetch.outputs.has_new == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const newKernels = `${{ steps.fetch.outputs.new_kernels }}`.trim().split('\n');
            const kernelList = newKernels.map(k => `- \`${k}\``).join('\n');
            
            const issueBody = `## New Ubuntu 22.04 (Jammy) Kernel Detected
            
            The following kernel version(s) are available in Ubuntu 22.04 releases but not yet configured in this repository:
            
            ${kernelList}
            
            **Source:** Ubuntu 22.04 (Jammy) riscv64 cloud images (https://cloud-images.ubuntu.com/releases/jammy/)
            
            ### Action Required
            
            1. Create directories for new kernels:
               \`\`\`bash
               ${newKernels.map(k => `mkdir -p src/${k}`).join('\n')}
               \`\`\`
            
            2. Add \`uname\` file for each kernel (infer from existing pattern)
            
            3. Update \`.github/workflows/push.yml\` matrix to include new kernels:
               - Add to userland build matrix (arm64)
               - Add to kernel build matrix (arm64) for ZFS 2.3.4 and 2.2.8
            
            4. Commit, push, and verify build artifacts in S3
            
            ---
            *This issue was automatically created by the Ubuntu Kernel Monitor workflow.*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `New Ubuntu 22.04 kernel available: ${newKernels.join(', ')}`,
              body: issueBody
            });
