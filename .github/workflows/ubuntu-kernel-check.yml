name: Ubuntu 24.04 Kernel Monitor

on:
  schedule:
    - cron: '0 12 * * *'  # Run daily at noon UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check_ubuntu_kernels:
    name: Check for new Ubuntu 24.04 kernels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch Ubuntu 24.04 release page
        id: fetch
        run: |
          # Fetch the page and extract kernel versions
          curl -s https://cloud-images.ubuntu.com/releases/24.04/release/ > /tmp/ubuntu-release.html
          
          # Extract kernel versions from filenames (e.g., ubuntu-24.04-server-cloudimg-arm64.manifest)
          # Look for patterns like 6.8.0-XX in the page
          KERNELS=$(grep -oP '6\.8\.0-\d+-generic' /tmp/ubuntu-release.html | sort -u)
          
          echo "Found kernels:"
          echo "$KERNELS"
          
          # Get existing kernels from src/ directory
          EXISTING=$(ls -1 src/ | grep '^6\.8\.0-.*-generic$' || true)
          
          echo "Existing kernels in src/:"
          echo "$EXISTING"
          
          # Find new kernels
          NEW_KERNELS=""
          for kernel in $KERNELS; do
            if ! echo "$EXISTING" | grep -q "^${kernel}$"; then
              NEW_KERNELS="${NEW_KERNELS}${kernel}\n"
            fi
          done
          
          if [ -n "$NEW_KERNELS" ]; then
            echo "new_kernels<<EOF" >> $GITHUB_OUTPUT
            echo -e "$NEW_KERNELS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_new=true" >> $GITHUB_OUTPUT
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create issue for new kernels
        if: steps.fetch.outputs.has_new == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const newKernels = `${{ steps.fetch.outputs.new_kernels }}`.trim().split('\n');
            const kernelList = newKernels.map(k => `- \`${k}\``).join('\n');
            
            const issueBody = `## New Ubuntu 24.04 Kernel Detected
            
            The following kernel version(s) are available on Ubuntu 24.04 but not yet configured in this repository:
            
            ${kernelList}
            
            **Source:** https://cloud-images.ubuntu.com/releases/24.04/release/
            
            ### Action Required
            
            1. Create directories for new kernels:
               \`\`\`bash
               ${newKernels.map(k => `mkdir -p src/${k}`).join('\n')}
               \`\`\`
            
            2. Add \`uname\` file for each kernel (infer from existing pattern)
            
            3. Update \`.github/workflows/push.yml\` matrix to include new kernels:
               - Add to userland build matrix (arm64)
               - Add to kernel build matrix (arm64) for ZFS 2.3.4 and 2.2.8
            
            4. Commit, push, and verify build artifacts in S3
            
            ---
            *This issue was automatically created by the Ubuntu Kernel Monitor workflow.*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `New Ubuntu 24.04 kernel available: ${newKernels.join(', ')}`,
              body: issueBody
            });
