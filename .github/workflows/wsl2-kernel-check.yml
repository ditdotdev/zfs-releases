name: WSL2 Kernel Monitor

on:
  schedule:
    - cron: '0 12 * * 1'  # Run weekly on Monday at noon UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write    # for workflow_dispatch of wsl2-modules.yml (issue #95)

jobs:
  check_wsl2_kernels:
    name: Check for new WSL2 kernel releases
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - uses: actions/checkout@v7

      - name: Fetch WSL2 kernel releases and check for missing builds
        id: fetch
        run: |
          # Get all 6.6.x WSL2 kernel releases (CONFIG_MODULES=y)
          RELEASES=$(curl -s https://api.github.com/repos/microsoft/WSL2-Linux-Kernel/releases | \
            jq -r '.[].tag_name' | grep '^linux-msft-wsl-6\.6\.' | \
            sed 's/linux-msft-wsl-//' | sort -V)

          echo "WSL2 6.6.x kernel releases:"
          echo "$RELEASES"

          # Get latest stable ZFS version
          ZFS_VER=$(curl -s https://api.github.com/repos/openzfs/zfs/releases | \
            jq -r '[.[] | select(.prerelease == false)] | first | .tag_name' | sed 's/^zfs-//')
          echo "Latest ZFS: $ZFS_VER"

          # Check which ones have S3 archives
          MISSING=""
          for ver in $RELEASES; do
            KREL="${ver}-microsoft-standard-WSL2"
            ARCHIVE="zfs-${ZFS_VER}-modules-${KREL}.tar.gz"
            if aws s3api head-object --bucket "${{ secrets.s3_bucket }}" --key "$ARCHIVE" 2>/dev/null; then
              echo "EXISTS: $ARCHIVE"
            else
              echo "MISSING: $ARCHIVE"
              MISSING="${MISSING}${ver}\n"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "missing_kernels<<EOF" >> "$GITHUB_OUTPUT"
            echo -e "$MISSING" | grep -v '^$' >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "has_missing=true" >> "$GITHUB_OUTPUT"
            echo "zfs_version=$ZFS_VER" >> "$GITHUB_OUTPUT"
          else
            echo "has_missing=false" >> "$GITHUB_OUTPUT"
            echo "All WSL2 kernels have ZFS module builds"
          fi

      # Close the loop: when archives are missing, dispatch the module build
      # workflow directly instead of waiting for a human to read an issue and
      # run `gh workflow run`. wsl2-modules.yml is idempotent — its per-cell
      # S3 cache check skips kernels that already have archives, so a stray
      # dispatch costs near-zero CI time. If the dispatch itself fails (auth
      # problem, workflow renamed, etc.) we fall through to the legacy
      # issue-filing path so the missing-archive signal isn't silently lost.
      # Closes #95.
      - name: Dispatch wsl2-modules.yml
        id: dispatch
        if: steps.fetch.outputs.has_missing == 'true'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'wsl2-modules.yml',
              ref: 'master',
            });
            console.log('Successfully dispatched wsl2-modules.yml');

      - name: Create issue (dispatch failed fallback)
        if: steps.fetch.outputs.has_missing == 'true' && steps.dispatch.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const missingKernels = `${{ steps.fetch.outputs.missing_kernels }}`.trim().split('\n');
            const zfsVersion = `${{ steps.fetch.outputs.zfs_version }}`;
            const kernelList = missingKernels.map(k => `- \`${k}\``).join('\n');
            const title = `Missing ZFS module builds for WSL2 kernels: ${missingKernels.join(', ')}`;

            // Check for existing open issue with the same title
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            if (existing.data.some(i => i.title === title)) {
              console.log(`Open issue already exists: ${title}`);
              return;
            }

            const issueBody = `## WSL2 ZFS Modules Missing in S3 — auto-dispatch failed

            The following WSL2 kernel version(s) do not have ZFS ${zfsVersion} module builds in S3:

            ${kernelList}

            The monitor tried to dispatch \`wsl2-modules.yml\` directly to close the loop (#95) but the dispatch step failed. Falling back to manual:

            \`\`\`bash
            gh workflow run "WSL2 ZFS Module Build" --repo ditdotdev/zfs-releases
            \`\`\`

            Check the monitor run logs to see why the dispatch call failed (most likely cause: \`wsl2-modules.yml\` was renamed or moved, or the \`actions: write\` permission was dropped). If any of the kernels above are not yet in \`wsl2-modules.yml\`'s matrix, add them there first.

            ---
            *This issue was automatically created by the WSL2 Kernel Monitor workflow as a dispatch-failure fallback.*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: issueBody
            });
