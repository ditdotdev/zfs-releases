name: Manual Kernel Build

on:
  workflow_dispatch:
    inputs:
      zfs:
        description: "zfs version (leave empty for latest stable)"
        required: false
        default: ""
      kernel:
        description: "linux kernel"
        required: true
      arch:
        description: "architecture (amd64 or arm64)"
        required: true
        default: "amd64"

permissions:
  contents: read

jobs:
  resolve-zfs-version:
    name: Resolve ZFS Version
    runs-on: ubuntu-latest
    outputs:
      zfs_version: ${{ steps.resolve.outputs.zfs_version }}
    steps:
      - name: Determine ZFS version
        id: resolve
        run: |
          if [[ -n "${{ github.event.inputs.zfs }}" ]]; then
            echo "zfs_version=${{ github.event.inputs.zfs }}" >> "$GITHUB_OUTPUT"
            echo "Using override: ${{ github.event.inputs.zfs }}"
          else
            LATEST=$(curl -s https://api.github.com/repos/openzfs/zfs/releases | \
              jq -r '[.[] | select(.prerelease == false)] | first | .tag_name' | sed 's/^zfs-//')
            echo "zfs_version=$LATEST" >> "$GITHUB_OUTPUT"
            echo "Latest stable ZFS: $LATEST"
          fi

  build_kernel:
    name: Build Kernel (${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ github.event.inputs.kernel }}, ${{ github.event.inputs.arch }})
    needs: [resolve-zfs-version]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ github.event.inputs.arch }} datadatdat/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ github.event.inputs.arch }}
        run: ./build -k -b ${{ secrets.s3_bucket }} -a ${{ github.event.inputs.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ github.event.inputs.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}
