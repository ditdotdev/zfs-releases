name: Manual Kernel Build

on:
  workflow_dispatch:
    inputs:
      zfs:
        description: "zfs version (leave empty for latest stable)"
        required: false
        default: ""
      kernel:
        description: "linux kernel"
        required: true
      arch:
        description: "architecture (amd64 or arm64)"
        required: true
        default: "amd64"

permissions:
  contents: read

jobs:
  resolve-zfs-version:
    name: Resolve ZFS Version
    runs-on: ubuntu-latest
    outputs:
      zfs_version: ${{ steps.resolve.outputs.zfs_version }}
    steps:
      - name: Determine ZFS version
        id: resolve
        run: |
          if [[ -n "${{ github.event.inputs.zfs }}" ]]; then
            echo "zfs_version=${{ github.event.inputs.zfs }}" >> "$GITHUB_OUTPUT"
            echo "Using override: ${{ github.event.inputs.zfs }}"
          else
            LATEST=$(curl -s https://api.github.com/repos/openzfs/zfs/releases | \
              jq -r '[.[] | select(.prerelease == false)] | first | .tag_name' | sed 's/^zfs-//')
            echo "zfs_version=$LATEST" >> "$GITHUB_OUTPUT"
            echo "Latest stable ZFS: $LATEST"
          fi

  build_image:
    name: Build ZFS Builder Image
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Checkout zfs-builder
        uses: actions/checkout@v6
        with:
          repository: datadatdat/zfs-builder
          token: ${{ secrets.GO_MODULES_TOKEN }}
      - name: Build zfs-builder image
        run: docker buildx build --platform linux/${{ github.event.inputs.arch }} --load -t datadatdat/zfs-builder:latest .
      - name: Save Docker image
        run: docker save datadatdat/zfs-builder:latest | gzip > zfs-builder.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: zfs-builder
          path: zfs-builder.tar.gz
          retention-days: 1

  build_kernel:
    name: Build Kernel (${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ github.event.inputs.kernel }}, ${{ github.event.inputs.arch }})
    needs: [build_image, resolve-zfs-version]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4
      - name: Download zfs-builder image
        uses: actions/download-artifact@v8
        with:
          name: zfs-builder
      - name: Load Docker image
        run: gunzip -c zfs-builder.tar.gz | docker load
      - name: Build
        run: ./build -k -b ${{ secrets.s3_bucket }} -a ${{ github.event.inputs.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ github.event.inputs.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}
