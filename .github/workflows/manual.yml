name: Manual Kernel Build

on:
  workflow_dispatch:
    inputs:
      zfs:
        description: "zfs version (leave empty for latest stable)"
        required: false
        default: ""
      kernel:
        description: "linux kernel"
        required: true
      arch:
        description: "architecture (amd64 or arm64)"
        required: true
        default: "amd64"
      dry_run:
        description: "build even if the artifact exists in S3, and do not publish"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  resolve-zfs-version:
    name: Resolve ZFS Version
    runs-on: ubuntu-latest
    outputs:
      zfs_version: ${{ steps.resolve.outputs.zfs_version }}
    steps:
      - name: Determine ZFS version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "${{ github.event.inputs.zfs }}" ]]; then
            echo "zfs_version=${{ github.event.inputs.zfs }}" >> "$GITHUB_OUTPUT"
            echo "Using override: ${{ github.event.inputs.zfs }}"
          else
            # Authenticated request: unauthenticated calls share the runner
            # IP's 60/hr rate limit and can return an error object, yielding
            # an empty version.
            LATEST=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
                https://api.github.com/repos/openzfs/zfs/releases | \
              jq -r '[.[] | select(.prerelease == false)] | first | .tag_name' | sed 's/^zfs-//')
            if [[ ! $LATEST =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "Failed to resolve ZFS version (got: '$LATEST')" >&2
              exit 1
            fi
            echo "zfs_version=$LATEST" >> "$GITHUB_OUTPUT"
            echo "Latest stable ZFS: $LATEST"
          fi

  build_kernel:
    name: Build Kernel (${{ needs.resolve-zfs-version.outputs.zfs_version }}, ${{ github.event.inputs.kernel }}, ${{ github.event.inputs.arch }})
    needs: [resolve-zfs-version]
    runs-on: ${{ github.event.inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Pull zfs-builder image
        run: docker pull --platform linux/${{ github.event.inputs.arch }} ditdotdev/zfs-builder:latest
      - name: Build
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ github.event.inputs.arch }}
        # dry_run omits -b so the S3 existence check cannot skip the build
        run: |
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            ./build -k -a ${{ github.event.inputs.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ github.event.inputs.kernel }}
          else
            ./build -k -b ${{ secrets.s3_bucket }} -a ${{ github.event.inputs.arch }} -z ${{ needs.resolve-zfs-version.outputs.zfs_version }} ${{ github.event.inputs.kernel }}
          fi
      - name: Publish
        if: github.event.inputs.dry_run != 'true'
        run: ./publish ${{ secrets.s3_bucket }}
