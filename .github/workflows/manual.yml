name: Manual Kernel Check

on:
  workflow_dispatch:
    inputs:
      ubuntu:
        description: "ubuntu version"
        required: true
        default: "22.04"
      zfs:
        description: "zfs version"
        required: true
        default: "2.3.4"
      kernel:
        description: "linux kernel"
        required: true

permissions:
  contents: read

jobs:
  build_kernel_ubuntu-manual:
    name: Build Kernel (${{ github.event.inputs.zfs }}, ${{ github.event.inputs.kernel }})
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Checkout zfs-builder
        uses: actions/checkout@v4
        with:
          repository: datadatdat/zfs-builder
          token: ${{ secrets.GO_MODULES_TOKEN }}
          path: zfs-builder
      - name: Build zfs-builder image
        run: |
          cd zfs-builder
          docker buildx build --platform linux/amd64 --load -t datadatdat/zfs-builder:latest .
      - name: Build
        run: ./build -k -z ${{ github.event.inputs.zfs }} ${{ github.event.inputs.kernel }}
      - name: Publish
        run: ./publish ${{ secrets.s3_bucket }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}