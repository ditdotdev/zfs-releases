name: WSL2 ZFS Module Build

on:
  workflow_dispatch:
    inputs:
      zfs_version:
        description: 'ZFS version override (leave empty for latest stable)'
        required: false
        default: ''
  push:
    branches: [master]
    paths:
      - '.github/workflows/wsl2-modules.yml'

permissions:
  contents: read

jobs:
  resolve-zfs-version:
    name: Resolve ZFS Version
    runs-on: ubuntu-latest
    outputs:
      zfs_version: ${{ steps.resolve.outputs.zfs_version }}
    steps:
      - name: Determine ZFS version
        id: resolve
        run: |
          if [[ -n "${{ github.event.inputs.zfs_version }}" ]]; then
            echo "zfs_version=${{ github.event.inputs.zfs_version }}" >> "$GITHUB_OUTPUT"
            echo "Using override: ${{ github.event.inputs.zfs_version }}"
          else
            LATEST=$(curl -s https://api.github.com/repos/openzfs/zfs/releases | \
              jq -r '[.[] | select(.prerelease == false)] | first | .tag_name' | sed 's/^zfs-//')
            echo "zfs_version=$LATEST" >> "$GITHUB_OUTPUT"
            echo "Latest stable ZFS: $LATEST"
          fi

  build-wsl2-modules:
    name: ZFS ${{ needs.resolve-zfs-version.outputs.zfs_version }} / WSL2 ${{ matrix.wsl_kernel }}
    needs: resolve-zfs-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wsl_kernel:
          - '6.6.36.3'    # Older WSL kernel
          - '6.6.36.6'    # Older WSL kernel
          - '6.6.75.1'    # WSL 2.5.1, 2.5.4
          - '6.6.75.2'    # WSL 2.5.1+ (if kernel updated)
          - '6.6.75.3'    # WSL 2.5.1+ (if kernel updated)
          - '6.6.84.1'    # WSL kernel
          - '6.6.87.1'    # WSL 2.5.7
          - '6.6.87.2'    # WSL 2.5.9+
          - '6.6.114.1'   # WSL kernel
          - '6.6.123.2'   # Latest kernel release
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-2
      WSL_KERNEL: ${{ matrix.wsl_kernel }}
      ZFS_VERSION: ${{ needs.resolve-zfs-version.outputs.zfs_version }}
    steps:
      - uses: actions/checkout@v6

      - name: Set archive name
        id: archive
        run: |
          KREL="${WSL_KERNEL}-microsoft-standard-WSL2"
          ARCHIVE="zfs-${ZFS_VERSION}-modules-${KREL}.tar.gz"
          echo "krel=$KREL" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "Archive: $ARCHIVE"

      - name: Check S3 cache
        id: cache
        run: |
          if aws s3api head-object --bucket "${{ secrets.s3_bucket }}" \
              --key "${{ steps.archive.outputs.archive }}" 2>/dev/null; then
            echo "cached=true" >> "$GITHUB_OUTPUT"
            echo "Archive already exists in S3, skipping build"
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"
            echo "Archive not found in S3, building"
          fi

      - name: Install build dependencies
        if: steps.cache.outputs.cached == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison libssl-dev \
            libelf-dev bc dwarves autoconf automake libtool gawk \
            uuid-dev libudev-dev libblkid-dev libtirpc-dev

      - name: Clone WSL2 kernel source
        if: steps.cache.outputs.cached == 'false'
        run: |
          WSL_TAG="linux-msft-wsl-${WSL_KERNEL}"
          echo "Cloning WSL2 kernel: $WSL_TAG"
          git clone --depth 1 --branch "$WSL_TAG" \
            https://github.com/microsoft/WSL2-Linux-Kernel.git /tmp/wsl2-kernel

      - name: Prepare kernel
        if: steps.cache.outputs.cached == 'false'
        run: |
          cd /tmp/wsl2-kernel
          cp Microsoft/config-wsl .config
          make olddefconfig
          make modules_prepare
          echo "Building kernel modules for Module.symvers..."
          make -j$(nproc) modules

      - name: Clone ZFS source
        if: steps.cache.outputs.cached == 'false'
        run: |
          echo "Cloning ZFS: zfs-${ZFS_VERSION}"
          git clone --depth 1 --branch "zfs-${ZFS_VERSION}" \
            https://github.com/openzfs/zfs.git /tmp/zfs

      - name: Build ZFS modules and userland
        if: steps.cache.outputs.cached == 'false'
        run: |
          cd /tmp/zfs
          sh autogen.sh
          ./configure --with-linux=/tmp/wsl2-kernel --with-linux-obj=/tmp/wsl2-kernel \
            --prefix=/usr --sysconfdir=/etc --localstatedir=/var
          make -j$(nproc)
          echo "=== Built modules ==="
          find module -name "*.ko" -exec ls -lh {} \;
          echo "=== Install userland to staging ==="
          make DESTDIR=/tmp/zfs-install install
          echo "=== Staged binaries ==="
          ls -lh /tmp/zfs-install/usr/sbin/z* 2>/dev/null || true
          ls -lh /tmp/zfs-install/usr/bin/z* 2>/dev/null || true

      - name: Verify modules
        if: steps.cache.outputs.cached == 'false'
        run: |
          test -f /tmp/zfs/module/spl.ko || { echo "ERROR: spl.ko not found"; exit 1; }
          test -f /tmp/zfs/module/zfs.ko || { echo "ERROR: zfs.ko not found"; exit 1; }
          SPL_SIZE=$(stat -c%s /tmp/zfs/module/spl.ko)
          ZFS_SIZE=$(stat -c%s /tmp/zfs/module/zfs.ko)
          echo "spl.ko: $((SPL_SIZE / 1048576))MB"
          echo "zfs.ko: $((ZFS_SIZE / 1048576))MB"
          test "$SPL_SIZE" -gt 1000000 || { echo "ERROR: spl.ko too small"; exit 1; }
          test "$ZFS_SIZE" -gt 50000000 || { echo "ERROR: zfs.ko too small"; exit 1; }

      - name: Package modules and userland
        if: steps.cache.outputs.cached == 'false'
        run: |
          ARCHIVE="${{ steps.archive.outputs.archive }}"
          mkdir -p /tmp/package/sbin /tmp/package/lib

          # Kernel modules
          cp /tmp/zfs/module/spl.ko /tmp/package/
          cp /tmp/zfs/module/zfs.ko /tmp/package/

          # Userland binaries from make install staging
          cp /tmp/zfs-install/usr/sbin/zpool /tmp/package/sbin/ 2>/dev/null || \
            cp /tmp/zfs-install/usr/bin/zpool /tmp/package/sbin/ 2>/dev/null || true
          cp /tmp/zfs-install/usr/sbin/zfs /tmp/package/sbin/ 2>/dev/null || \
            cp /tmp/zfs-install/usr/bin/zfs /tmp/package/sbin/ 2>/dev/null || true
          cp /tmp/zfs-install/usr/sbin/zdb /tmp/package/sbin/ 2>/dev/null || \
            cp /tmp/zfs-install/usr/bin/zdb /tmp/package/sbin/ 2>/dev/null || true

          # Shared libraries
          find /tmp/zfs-install -name "libzfs.so*" -exec cp {} /tmp/package/lib/ \;
          find /tmp/zfs-install -name "libzfs_core.so*" -exec cp {} /tmp/package/lib/ \;
          find /tmp/zfs-install -name "libnvpair.so*" -exec cp {} /tmp/package/lib/ \;
          find /tmp/zfs-install -name "libuutil.so*" -exec cp {} /tmp/package/lib/ \;
          find /tmp/zfs-install -name "libzpool.so*" -exec cp {} /tmp/package/lib/ \;

          # Version file
          echo "ZFS_VERSION=${ZFS_VERSION}" > /tmp/package/VERSION
          echo "KREL=${{ steps.archive.outputs.krel }}" >> /tmp/package/VERSION

          # Verify we have the essentials
          echo "=== Package contents ==="
          ls -lhR /tmp/package/
          test -f /tmp/package/spl.ko || { echo "ERROR: spl.ko missing"; exit 1; }
          test -f /tmp/package/zfs.ko || { echo "ERROR: zfs.ko missing"; exit 1; }

          cd /tmp/package
          tar -czf "/tmp/$ARCHIVE" .
          echo "Created: $ARCHIVE ($(du -h /tmp/$ARCHIVE | cut -f1))"

      - name: Upload to S3
        if: steps.cache.outputs.cached == 'false'
        run: |
          ARCHIVE="${{ steps.archive.outputs.archive }}"
          aws s3 cp "/tmp/$ARCHIVE" "s3://${{ secrets.s3_bucket }}/$ARCHIVE"
          echo "Uploaded: s3://${{ secrets.s3_bucket }}/$ARCHIVE"

      - name: Verify S3 upload
        if: steps.cache.outputs.cached == 'false'
        run: |
          ARCHIVE="${{ steps.archive.outputs.archive }}"
          URL="http://dit-zfs-builds.s3-website-us-west-2.amazonaws.com/$ARCHIVE"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "Verify URL: $URL -> HTTP $HTTP_CODE"
          test "$HTTP_CODE" = "200" || { echo "ERROR: S3 upload verification failed"; exit 1; }

      - name: Upload artifact
        if: steps.cache.outputs.cached == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.archive }}
          path: /tmp/${{ steps.archive.outputs.archive }}
          retention-days: 30
