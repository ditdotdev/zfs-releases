name: WSL2 Kernel Build

on:
  workflow_dispatch:
    inputs:
      wsl_tag:
        description: 'WSL2 kernel tag (e.g., linux-msft-wsl-6.6.75.2)'
        required: false
      zfs_version:
        description: 'ZFS version (e.g., 2.3.4)'
        required: false
        default: '2.3.4'
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

permissions:
  contents: write

jobs:
  build_image:
    name: Build ZFS Builder Image (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Checkout zfs-builder
        uses: actions/checkout@v6
        with:
          repository: datadatdat/zfs-builder
          token: ${{ secrets.GO_MODULES_TOKEN }}
      - name: Build zfs-builder image
        run: docker buildx build --platform linux/amd64 --load -t datadatdat/zfs-builder:latest .
      - name: Save Docker image
        run: docker save datadatdat/zfs-builder:latest | gzip > zfs-builder.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: zfs-builder-amd64
          path: zfs-builder.tar.gz
          retention-days: 1

  build_wsl2_kernel:
    name: Build WSL2 Kernel (${{ matrix.wsl_tag }}, ZFS ${{ matrix.zfs }})
    needs: build_image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Active Microsoft WSL2 kernel releases (x86_64 only)
          - wsl_tag: linux-msft-wsl-6.6.75.2
            kernel_release: 6.6.75.2-microsoft-standard-WSL2
            kernel_version: '6.6.75.2'
            zfs: '2.3.4'
          - wsl_tag: linux-msft-wsl-6.1.21.2
            kernel_release: 6.1.21.2-microsoft-standard-WSL2
            kernel_version: '6.1.21.2'
            zfs: '2.3.4'
          - wsl_tag: linux-msft-wsl-5.15.167.4
            kernel_release: 5.15.167.4-microsoft-standard-WSL2
            kernel_version: '5.15.167.4'
            zfs: '2.3.4'
    steps:
      - uses: actions/checkout@v6

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="wsl2-kernel-${{ matrix.kernel_release }}-zfs-${{ matrix.zfs }}"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download zfs-builder image
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: zfs-builder-amd64

      - name: Load Docker image
        if: steps.check_release.outputs.skip != 'true'
        run: gunzip -c zfs-builder.tar.gz | docker load

      - name: Build WSL2 kernel with ZFS
        if: steps.check_release.outputs.skip != 'true'
        run: |
          mkdir -p out
          docker run --rm \
            -e KERNEL_RELEASE="${{ matrix.kernel_release }}" \
            -e KERNEL_VERSION="${{ matrix.kernel_version }}" \
            -e ZFS_VERSION="zfs-${{ matrix.zfs }}" \
            -e WSL2_KERNEL_TAG="${{ matrix.wsl_tag }}" \
            -e CI_BUILD=1 \
            -e ZFS_CONFIG=kernel \
            -v "$PWD/out:/out" \
            datadatdat/zfs-builder:latest

      - name: Find and validate bzImage
        if: steps.check_release.outputs.skip != 'true'
        run: |
          echo "Contents of /out:"
          ls -la out/

          # Find the bzImage (name includes kernel release and suffix)
          BZIMAGE=$(ls out/bzImage-* 2>/dev/null | head -1)
          if [ -z "$BZIMAGE" ]; then
            echo "ERROR: No bzImage found in out/"
            exit 1
          fi

          echo "Found: $BZIMAGE"

          # Validate it's a Linux kernel boot executable
          FILE_TYPE=$(file "$BZIMAGE")
          echo "File type: $FILE_TYPE"
          if ! echo "$FILE_TYPE" | grep -qi "linux.*boot"; then
            echo "ERROR: $BZIMAGE does not appear to be a Linux kernel boot image"
            exit 1
          fi

          # Validate file size (expect 10-30MB for a kernel with ZFS built-in)
          SIZE=$(stat -c%s "$BZIMAGE")
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Size: ${SIZE_MB}MB ($SIZE bytes)"
          if [ "$SIZE_MB" -lt 5 ] || [ "$SIZE_MB" -gt 50 ]; then
            echo "ERROR: bzImage size ${SIZE_MB}MB is outside expected range (5-50MB)"
            exit 1
          fi

          # Rename to standard name for release
          cp "$BZIMAGE" "out/bzImage"

          # Generate checksum
          cd out
          sha256sum bzImage > CHECKSUMS.sha256
          sha256sum "$(basename "$BZIMAGE")" >> CHECKSUMS.sha256
          cat CHECKSUMS.sha256

      - name: Upload bzImage artifact
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wsl2-kernel-${{ matrix.kernel_release }}-zfs-${{ matrix.zfs }}
          path: |
            out/bzImage
            out/bzImage-*
            out/CHECKSUMS.sha256
          retention-days: 30

  publish_draft_release:
    name: Publish Draft Release (${{ matrix.wsl_tag }}, ZFS ${{ matrix.zfs }})
    needs: build_wsl2_kernel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wsl_tag: linux-msft-wsl-6.6.75.2
            kernel_release: 6.6.75.2-microsoft-standard-WSL2
            zfs: '2.3.4'
          - wsl_tag: linux-msft-wsl-6.1.21.2
            kernel_release: 6.1.21.2-microsoft-standard-WSL2
            zfs: '2.3.4'
          - wsl_tag: linux-msft-wsl-5.15.167.4
            kernel_release: 5.15.167.4-microsoft-standard-WSL2
            zfs: '2.3.4'
    steps:
      - uses: actions/checkout@v6

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="wsl2-kernel-${{ matrix.kernel_release }}-zfs-${{ matrix.zfs }}"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download kernel artifact
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: wsl2-kernel-${{ matrix.kernel_release }}-zfs-${{ matrix.zfs }}
          path: artifacts/

      - name: Create draft GitHub Release
        if: steps.check_release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.check_release.outputs.release_tag }}"
          RELEASE_TITLE="WSL2 Kernel ${{ matrix.kernel_release }} with ZFS ${{ matrix.zfs }}"

          RELEASE_BODY="## Prebuilt WSL2 Kernel with ZFS

          **Kernel:** ${{ matrix.kernel_release }} (from [${{ matrix.wsl_tag }}](https://github.com/microsoft/WSL2-Linux-Kernel/releases/tag/${{ matrix.wsl_tag }}))
          **ZFS:** ${{ matrix.zfs }} (built-in, statically compiled)
          **Architecture:** x86_64 (amd64)

          ### Installation

          1. Download \`bzImage\` from this release
          2. Save to \`%USERPROFILE%\\.datadatdat\\kernels\\bzImage\`
          3. Add to \`%USERPROFILE%\\.wslconfig\`:
             \`\`\`ini
             [wsl2]
             kernel=C:\\\\Users\\\\<username>\\\\.datadatdat\\\\kernels\\\\bzImage
             \`\`\`
          4. Run \`wsl --shutdown\` then restart your WSL2 terminal
          5. Verify: \`grep zfs /proc/filesystems\` should show \`nodev zfs\`

          ### Why a Custom Kernel?

          The default WSL2 kernel ships with \`CONFIG_MODULES=n\`, which means kernel modules cannot be loaded at all. ZFS must be statically compiled into the kernel (\`CONFIG_ZFS=y\`).

          ### Source

          - WSL2 Kernel: [microsoft/WSL2-Linux-Kernel@${{ matrix.wsl_tag }}](https://github.com/microsoft/WSL2-Linux-Kernel/releases/tag/${{ matrix.wsl_tag }})
          - OpenZFS: [openzfs/zfs@zfs-${{ matrix.zfs }}](https://github.com/openzfs/zfs/releases/tag/zfs-${{ matrix.zfs }})
          - Builder: [datadatdat/zfs-builder](https://github.com/datadatdat/zfs-builder)

          ### License

          This kernel image combines GPL v2 (Linux kernel) and CDDL (OpenZFS) licensed code. See [WSL2-LICENSE.md](https://github.com/datadatdat/zfs-releases/blob/master/WSL2-LICENSE.md) for details.

          ---
          **Status: DRAFT** — This release must pass Vagrant E2E validation before publishing."

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_BODY" \
            --draft \
            artifacts/bzImage \
            artifacts/bzImage-* \
            artifacts/CHECKSUMS.sha256
